[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --cov=src --cov-report=term --cov-fail-under=40
markers =
    smoke: Live data-source connectivity probes with real API calls
    integration: Integration checks using real external dependencies
    e2e: End-to-end checks using real data and channels
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore::UserWarning
