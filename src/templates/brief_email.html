<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{label}</title>
    <style>
        table {{
            border-collapse: collapse;
            width: 100%;
            margin: 15px 0;
        }}
        th, td {{
            border: 1px solid #ddd;
            padding: 6px 10px;
            text-align: left;
            font-size: 13px;
        }}
        th {{
            background-color: #f2f2f2;
            font-weight: bold;
        }}
</style>
</head>
<body>
    <p style="font-size:12px;color:#173a61;">版本 {release_label}</p>
    <h2>{label} - {report_date}</h2>
    <p>
        检测时间：{current_time}&nbsp;&nbsp;|&nbsp;&nbsp;
        可用报价：{active_count}/{total_count}
    </p>

    <table>
        <tr>
            {brief_columns}
        </tr>
        {brief_rows}
    </table>

    <p style="color:#888;font-size:12px;">
        {brief_note}
    </p>

    {strategy_suggestions}

</body>
</html>
