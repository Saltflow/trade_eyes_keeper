<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股票量化日报</title>
<style>
  body {{ margin:0; padding:0; background:#f3f6fa; color:#26364a;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",
      "PingFang SC",sans-serif; line-height:1.45; }}
  .shell {{ width:100%; max-width:680px; background:#fff; }}
  .content {{ padding:12px 16px 18px; }}
  .daily-section {{ margin:0 0 14px; }}
  .section-heading {{ padding:8px 0 7px; border-bottom:2px solid #dce6f0;
    color:#173b62; font-size:15px; font-weight:700; }}
  .section-count {{ float:right; color:#718096; font-size:11px; font-weight:400; }}
  .group-heading {{ margin:10px 0 5px; color:#56708d; font-size:12px; font-weight:700; }}
  .deployment-strip {{ margin-bottom:12px; padding:8px 10px; border:1px solid #c9d8e7;
    border-radius:7px; background:#f5f9fd; color:#53687d; font-size:11px; overflow-wrap:anywhere; }}
  .deployment-strip strong {{ color:#173b62; }}
  .summary-grid,.metric-grid,.watchlist-table {{ width:100%; border-collapse:separate;
    border-spacing:0; table-layout:fixed; }}
  .summary-cell,.metric-cell {{ padding:7px 8px; border:1px solid #e3ebf3;
    background:#f8fbfe; vertical-align:top; }}
  .summary-label,.metric-label {{ color:#718096; font-size:10px; }}
  .summary-value,.metric-value {{ margin-top:2px; color:#173b62; font-size:16px; font-weight:700; }}
  .market-card {{ margin-top:8px; padding:9px 10px; border:1px solid #e0e8f0;
    border-radius:8px; background:#fff; }}
  .market-card-inactive {{ background:#fafbfd; }}
  .market-title {{ display:flex; justify-content:space-between; gap:8px; color:#173b62;
    font-size:13px; overflow-wrap:anywhere; }}
  .market-title span,.market-benchmark {{ color:#65778a; font-size:11px; text-align:right; }}
  .market-benchmark {{ margin:4px 0 6px; text-align:left; }}
  .metric-grid .metric-cell {{ width:50%; padding:6px 7px; }}
  .metric-grid tr:first-child .metric-cell:first-child {{ border-radius:5px 0 0 0; }}
  .metric-grid tr:first-child .metric-cell:last-child {{ border-radius:0 5px 0 0; }}
  .metric-grid tr:last-child .metric-cell:first-child {{ border-radius:0 0 0 5px; }}
  .metric-grid tr:last-child .metric-cell:last-child {{ border-radius:0 0 5px 0; }}
  .metric-positive {{ color:#1f7a4d !important; }}
  .metric-negative {{ color:#b43b3b !important; }}
  .holdout-title {{ margin-top:8px; color:#526b86; font-size:11px; font-weight:700; }}
  .holdout-summary,.holdout-note {{ margin-top:3px; color:#53687d; font-size:11px; overflow-wrap:anywhere; }}
  .holdout-note {{ color:#8a6435; }}
  .holdout-chip-row {{ display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }}
  .holdout-chip {{ flex:1 1 45%; min-width:0; padding:4px 5px; border:1px solid #d9e7f2;
    border-radius:5px; background:#f7fbff; color:#526b86; font-size:10px; overflow-wrap:anywhere; }}
  .status-badge {{ display:inline-block; margin-left:4px; padding:1px 5px; border-radius:8px;
    white-space:nowrap; font-size:10px; font-weight:600; vertical-align:1px; }}
  .status-alert {{ color:#9f2d2d; background:#fdecec; }}
  .status-signal {{ color:#315a82; background:#e7f1fb; }}
  .status-stale {{ color:#876b2c; background:#fbf4df; }}
  .watchlist-table {{ margin-top:3px; font-size:11px; }}
  .watchlist-table th {{ padding:5px 4px; border-bottom:1px solid #cfdde9; color:#718096;
    font-size:10px; font-weight:600; text-align:right; }}
  .watchlist-table th:first-child {{ width:36%; text-align:left; }}
  .watchlist-table td {{ padding:5px 4px; border-bottom:1px solid #edf1f5; text-align:right;
    vertical-align:top; overflow-wrap:anywhere; }}
  .watchlist-table td:first-child {{ text-align:left; }}
  .watch-row-action {{ background:#fbfdff; }}
  .watch-row-stale {{ background:#fffdf7; color:#8a7a58; }}
  .watch-instrument strong {{ display:block; color:#173b62; font-size:11px; }}
  .watch-instrument span {{ display:block; color:#4a5c70; overflow-wrap:anywhere; }}
  .chart-card {{ margin-top:8px; padding:8px; border:1px solid #e0e8f0;
    border-radius:8px; background:#fbfdff; }}
  .chart-card img {{ display:block; width:100%; max-width:100%; height:auto; }}
  .event-row {{ padding:6px 1px; border-bottom:1px solid #e8eef4; color:#4a5c70;
    font-size:11px; overflow-wrap:anywhere; }}
  .event-row:last-of-type {{ border-bottom:0; }}
  .event-date {{ display:inline-block; min-width:72px; color:#718096; }}
  .event-kind {{ display:inline-block; margin-right:4px; padding:1px 4px; border-radius:4px;
    background:#eef6ff; color:#315a82; font-size:10px; }}
  .muted-note {{ margin-top:6px; color:#7a8998; font-size:10px; overflow-wrap:anywhere; }}
  .link-card {{ margin-top:8px; padding:9px 10px; border-radius:7px; background:#eef6ff;
    color:#315a82; font-size:11px; overflow-wrap:anywhere; }}
  a {{ color:#1769aa; text-decoration:none; }}
  @media screen and (max-width:480px) {{
    .content {{ padding:10px 12px 14px !important; }}
    .mobile-hide {{ display:none !important; }}
    .watchlist-table th:first-child {{ width:43% !important; }}
    .watchlist-table th,.watchlist-table td {{ padding:5px 3px !important; }}
    .market-title {{ display:block !important; }}
    .market-title span {{ display:block; margin-top:2px; text-align:left !important; }}
    .deployment-strip span {{ display:block; margin-top:2px; }}
    .holdout-chip {{ flex-basis:100%; }}
  }}
</style>
</head>
<body>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;background:#f3f6fa;">
  <tr><td align="center" style="padding:12px 0;">
    <table role="presentation" class="shell" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:680px;background:#fff;">
      <tr><td style="padding:16px 16px 12px;background:#173b62;color:#fff;">
        <div style="font-size:20px;font-weight:700;letter-spacing:.3px;">股票量化日报</div>
        <div style="margin-top:3px;color:#dbe8f4;font-size:11px;">{current_time}</div>
      </td></tr>
      <tr><td class="content" style="padding:12px 16px 18px;">
        {deployment_status}
        {summary_section}
        <!-- Strategy Search Results -->
        {decision_section}
        {watchlist_section}
        {chart_section}
        {portfolio_chart_section}
        {events_section}
        {report_links}
      </td></tr>
      <tr><td style="padding:12px 16px 18px;border-top:1px solid #e3ebf3;color:#8a98a7;font-size:10px;text-align:center;">
        股票量化系统自动发送 · 部署节点与公网 IP 用于部署确认 · 深度明细见 PDF/完整报告
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
